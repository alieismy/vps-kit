name: Local contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: windows-2025
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare Windows timezone database
        if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - name: Run synthetic contract tests
        run: python -B tests/run.py
      - name: Verify local curl transport
        run: python -B tests/loopback_transport.py
      # Hosted runner tests do not establish Linux/systemd or real panel acceptance.
